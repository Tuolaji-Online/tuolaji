name: ci

# Test and build on pull requests and pushes to main; publish the built
# artifacts only on a tag push (gated on the test and build jobs).
# Linux (Ubuntu) only: the released `vessel-linux64` binary is used.
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: write

env:
  VESSEL_VERSION: v0.8.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-motoko
        with:
          vessel-version: ${{ env.VESSEL_VERSION }}

      - name: Run the pure Motoko test suite
        run: |
          PKGS="$(vessel sources)"
          moc -r $PKGS test/Run.mo

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-motoko
        with:
          vessel-version: ${{ env.VESSEL_VERSION }}

      - name: Build tuolaji.wasm and tuolaji.did
        run: |
          PKGS="$(vessel sources)"
          moc $PKGS --public-metadata candid:service --public-metadata candid:args -o tuolaji.wasm src/main.mo
          moc $PKGS --idl -o tuolaji.did src/main.mo
          ls -l tuolaji.wasm tuolaji.did

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: canisters
          path: |
            tuolaji.wasm
            tuolaji.did

  release:
    # Tag pushes only — no other refs are released.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          name: canisters
          path: .

      - name: Release the build artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            tuolaji.wasm
            tuolaji.did
